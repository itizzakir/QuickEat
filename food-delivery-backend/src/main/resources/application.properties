spring.application.name=food-delivery-backend

# Datasource — override via environment variables in every real deployment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# JWT Configuration — the secret MUST be valid Base64 (JwtUtils decodes it with Decoders.BASE64).
# The default below is a development-only key; set JWT_SECRET in any non-local environment.
app.jwtSecret=${JWT_SECRET:axjQoAl4LmdvO8k5KU/wyi4mQs+Vh24dvv6K7YMpA0jo2kqn+8nTZ8G/xZsBA/qjCAiUoyyT7UdKk7ZE5RhawQ==}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Seed data
app.seed.enabled=${SEED_ENABLED:true}

# CORS — comma-separated list of browser origins allowed to call the API.
# Wildcards are not permitted here because the API sends credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
