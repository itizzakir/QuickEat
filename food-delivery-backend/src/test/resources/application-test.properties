# Tests run against in-memory H2 so `mvn package` never needs a MySQL server.
spring.datasource.url=jdbc:h2:mem:quickbite;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# Clear the MySQLDialect set in application.properties; H2's dialect is auto-detected.
spring.jpa.properties.hibernate.dialect=
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwtSecret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLXRoZS1xdWlja2JpdGUtdGVzdC1wcm9maWxlLW5vdC1hLXJlYWwta2V5ISE=
app.jwtExpirationMs=86400000

# The seeder is also @Profile("!test"); this keeps it off even if the profile changes.
app.seed.enabled=false

app.cors.allowed-origins=http://localhost:5173
